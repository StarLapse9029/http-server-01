<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#111;
  color:#fff;
  font:16px Arial
}
main{
  width:min(700px,90%);
  padding:30px;
  border-radius:16px;
  background:#222;
  box-shadow:0 8px 30px #000
}
h1{
  margin:0 0 20px;
  color:#6cf
}
label{
  display:block;
  margin:14px 0 6px;
  color:#bbb
}
input,textarea{
  width:100%;
  padding:10px;
  border:1px solid #444;
  border-radius:8px;
  background:#111;
  color:#fff;
  font:14px monospace
}
textarea{
  min-height:150px;
  resize:vertical
}
button{
  margin-top:20px;
  padding:10px 18px;
  border:0;
  border-radius:8px;
  background:#6cf;
  color:#111;
  cursor:pointer;
  font-weight:bold
}
button:disabled{
  opacity:.5;
  cursor:not-allowed
}
#status{
  margin-top:20px;
  color:#6cf
}
pre{
  margin-top:10px;
  padding:15px;
  border-radius:8px;
  background:#111;
  color:#ddd;
  overflow:auto;
  white-space:pre-wrap
}
</style>
</head>

<body>

<main>
  <h1>POST Request Tester</h1>

  <label for="url">URL</label>
  <input
    id="url"
    value="https://httpbin.org/post"
    placeholder="https://example.com/api"
  >

  <label for="headers">Headers (JSON)</label>
  <textarea id="headers">{
  "Content-Type": "application/json"
}</textarea>

  <label for="body">Request Body (JSON)</label>
  <textarea id="body">{
  "message": "Hello World"
}</textarea>

  <button id="send" onclick="sendRequest()">Send POST</button>

  <div id="status"></div>
  <pre id="response">No response yet.</pre>
</main>

<script>
async function sendRequest(){
  const url=document.getElementById("url").value.trim();
  const headersText=document.getElementById("headers").value;
  const bodyText=document.getElementById("body").value;
  const button=document.getElementById("send");
  const status=document.getElementById("status");
  const responseBox=document.getElementById("response");

  let headers;

  try{
    headers=JSON.parse(headersText);
  }catch{
    status.textContent="Invalid headers JSON.";
    return;
  }

  try{
    JSON.parse(bodyText);
  }catch{
    status.textContent="Invalid body JSON.";
    return;
  }

  button.disabled=true;
  status.textContent="Sending...";
  responseBox.textContent="";

  try{
    const response=await fetch(url,{
      method:"POST",
      headers:headers,
      body:bodyText
    });

    status.textContent=`HTTP ${response.status} ${response.statusText}`;

    const text=await response.text();

    try{
      responseBox.textContent=
        JSON.stringify(JSON.parse(text),null,2);
    }catch{
      responseBox.textContent=text;
    }

  }catch(error){
    status.textContent="Request failed";
    responseBox.textContent=error.message;
  }

  button.disabled=false;
}
</script>

</body>
</html>
